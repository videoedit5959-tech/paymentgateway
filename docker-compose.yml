version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paysync_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/paysync
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-paysync_jwt_access_secret_super_secure_key_min_32_chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-paysync_jwt_refresh_secret_super_secure_key_min_32_chars}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-paysync_wh_secret_key_super_secure_32_chars}
      - DEVICE_AUTH_SECRET=${DEVICE_AUTH_SECRET:-paysync_device_pairing_and_auth_secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-paysync_aes256_encryption_key_32bytes}
      - PAYMENT_EXPIRY_MINUTES=15
    depends_on:
      - mongo
    networks:
      - paysync-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:6.0
    container_name: paysync_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - paysync-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: paysync_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    networks:
      - paysync-network

networks:
  paysync-network:
    driver: bridge

volumes:
  mongo_data:

